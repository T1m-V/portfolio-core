[project]
name = "portfolio-core"
version = "0.3.0"
description = "Shared configuration and persisted-data contracts for the portfolio tools"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pandas>=2.3.3",
    "platformdirs>=4.3.8",
    "python-dotenv>=1.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.10",
]

[build-system]
requires = ["uv-build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.3,<0.13"
preview-features = ["centralized-project-envs"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
